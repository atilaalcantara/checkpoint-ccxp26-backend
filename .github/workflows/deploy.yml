name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/atilaalcantara/checkpoint-api
  SSH_TARGET: deploy@oracle.atilaalcantara.com
  # Chave publica do servidor (nao e segredo): ssh-keyscan -t ed25519 oracle.atilaalcantara.com
  KNOWN_HOST: oracle.atilaalcantara.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOyLkQWog66Y5uXF5pBwM0Q5WsggzfB8P9KB/Rgx788e

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Build test stage
        run: docker build --target test -t checkpoint-test .
      - name: Run tests
        run: >-
          docker run --rm --network host
          -e CHECKPOINT_TEST_ADMIN="Host=localhost;Username=postgres;Password=postgres;Database=postgres"
          checkpoint-test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SSH_TARGET" bash -s -- "$IMAGE:$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          IMG="$1"
          docker pull "$IMG"
          docker rm -f checkpoint-api >/dev/null 2>&1 || true
          docker run -d --name checkpoint-api --restart unless-stopped \
            --network shared-net --env-file /home/ubuntu/apps/checkpoint/.env \
            --memory 768m --cpus 1 "$IMG" >/dev/null
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' checkpoint-api)
            [ "$status" = healthy ] && { echo "checkpoint-api healthy: $IMG"; docker image prune -f >/dev/null; exit 0; }
            sleep 3
          done
          docker logs --tail 80 checkpoint-api
          exit 1
          REMOTE
